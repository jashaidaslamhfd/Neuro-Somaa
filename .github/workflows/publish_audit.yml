name: Audit and publish YouTube video

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID to audit and publish"
        required: true
        type: string
      make_public:
        description: "Publish only after metadata and thumbnail checks"
        required: true
        type: boolean
        default: false

jobs:
  audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit metadata and publish
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          VIDEO_ID: ${{ inputs.video_id }}
          MAKE_PUBLIC: ${{ inputs.make_public }}
        run: |
          set -euo pipefail
          [[ "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{6,}$ ]] || { echo "Invalid YouTube video ID" >&2; exit 1; }
          args=(--video-id "$VIDEO_ID")
          if [ "$MAKE_PUBLIC" = "true" ]; then args+=(--make-public); fi
          python scripts/audit_publish.py "${args[@]}"
