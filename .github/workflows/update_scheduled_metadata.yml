name: Update scheduled video metadata

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Existing YouTube video ID"
        required: true
        type: string
      title:
        description: "New French title"
        required: true
        type: string
      description:
        description: "New French description"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Google client
        run: python3 -m pip install -q --user google-api-python-client google-auth

      - name: Update only requested metadata
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          VIDEO_ID: ${{ inputs.video_id }}
          NEW_TITLE: ${{ inputs.title }}
          NEW_DESCRIPTION: ${{ inputs.description }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          required = ["GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "REFRESH_TOKEN", "VIDEO_ID", "NEW_TITLE", "NEW_DESCRIPTION"]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing required workflow inputs/secrets: " + ", ".join(missing))

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["REFRESH_TOKEN"],
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              token_uri="https://oauth2.googleapis.com/token",
              scopes=["https://www.googleapis.com/auth/youtube.force-ssl"],
          )
          yt = build("youtube", "v3", credentials=credentials)
          video_id = os.environ["VIDEO_ID"]
          current = yt.videos().list(part="snippet,status", id=video_id).execute().get("items", [])
          if not current:
              raise SystemExit(f"Video not found: {video_id}")
          item = current[0]
          old_snippet = item.get("snippet", {})
          old_status = item.get("status", {})
          if old_status.get("privacyStatus") not in {"private", "public"}:
              raise SystemExit(f"Unexpected privacy state: {old_status.get('privacyStatus')}")
          snippet = {
              "title": os.environ["NEW_TITLE"][:100],
              "description": os.environ["NEW_DESCRIPTION"][:5000],
              "categoryId": old_snippet.get("categoryId", "27"),
              "tags": old_snippet.get("tags", []),
              "defaultLanguage": "fr",
              "defaultAudioLanguage": "fr",
          }
          result = yt.videos().update(part="snippet", body={"id": video_id, "snippet": snippet}).execute()
          print("Metadata updated successfully")
          print("video_id:", result.get("id"))
          print("title:", result.get("snippet", {}).get("title"))
          print("privacyStatus preserved:", old_status.get("privacyStatus"))
          print("publishAt preserved:", old_status.get("publishAt"))
          PY
