name: "🔧 Réparer les vidéos publiées (tout-en-un)"

# UN SEUL bouton pour corriger toutes les vidéos DÉJÀ EN LIGNE :
#
#   1. Miniatures  — remplace les miniatures fautives par les nouvelles
#                    (accents français corrects, plus de visuel horreur,
#                    plus de doublon visuel, plus de flou).
#   2. Métadonnées — supprime les 107 tags anglais, les 35 tags de gabarit,
#                    et dédoublonne les descriptions.
#
# DRY-RUN par défaut : rien n'est écrit tant que apply=false.
# Ne touche JAMAIS aux titres et ne supprime aucune vidéo.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = écrire sur YouTube ; false = simulation"
        required: true
        default: false
        type: boolean
      thumbnails:
        description: "Mettre à jour les miniatures"
        required: false
        default: true
        type: boolean
      metadata:
        description: "Nettoyer tags + descriptions"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: skillor-fix-published
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier les secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for var in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET REFRESH_TOKEN; do
            if [ -z "${!var:-}" ]; then echo "::error::$var manquant"; missing=1; fi
          done
          exit "$missing"

      # ---- 1. Métadonnées : tags anglais + descriptions dupliquées --------
      - name: "Métadonnées — tags FR + descriptions"
        if: ${{ inputs.metadata }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.apply }}" = "true" ]; then
            python scripts/fr_metadata_sweep.py --apply
          else
            python scripts/fr_metadata_sweep.py
          fi

      # ---- 2. Miniatures ---------------------------------------------------
      # thumbnails.set n'a pas de mode simulation : en dry-run on se contente
      # de lister ce qui serait envoyé.
      - name: "Miniatures — simulation"
        if: ${{ inputs.thumbnails && !inputs.apply }}
        run: |
          set -euo pipefail
          echo "Simulation — ces miniatures seraient envoyées :"
          for f in assets/thumbnails_fr/*.jpg; do
            printf '  %-52s %s KB\n' "$f" "$(( $(stat -c%s "$f") / 1024 ))"
          done
          echo "Relancer avec apply=true pour les publier."

      - name: "Miniatures — envoi"
        if: ${{ inputs.thumbnails && inputs.apply }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python scripts/thumbnail_update.py

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-published-${{ github.run_id }}
          path: |
            output/fr_metadata_sweep.json
            output/thumbnail_update_report.txt
          if-no-files-found: ignore
