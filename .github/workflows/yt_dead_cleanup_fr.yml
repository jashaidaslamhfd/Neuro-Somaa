name: "SKILLOR - FR YouTube Dead-Video Cleanup (one-shot)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillor-fr-yt-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # stdlib-only script — no pip install needed.
      - name: Scan + delete algorithm-dead videos (<=10 views after >=7 days)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python scripts/yt_dead_cleanup_fr.py --apply
