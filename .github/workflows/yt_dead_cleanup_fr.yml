name: "SKILLOR - FR YouTube Dead-Video Cleanup (one-shot)"

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = PERMANENTLY DELETE the listed videos; false = dry-run scan only"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: skillor-fr-yt-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # stdlib-only script — no pip install needed.
      # Video deletion is IRREVERSIBLE, so this matches every other admin
      # workflow in the repo: dry-run unless the operator ticks `apply`.
      # It previously hardcoded --apply, meaning one accidental click on
      # "Run workflow" permanently destroyed videos with no confirmation.
      - name: Scan + delete algorithm-dead videos (<=10 views after >=7 days)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.apply }}" = "true" ]; then
            echo "::warning::APPLY MODE - matching videos will be permanently deleted."
            python scripts/yt_dead_cleanup_fr.py --apply
          else
            echo "Dry-run scan (no deletions). Re-run with apply=true to delete."
            python scripts/yt_dead_cleanup_fr.py
          fi
