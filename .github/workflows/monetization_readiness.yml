name: "Monetization Readiness (daily plan)"

# Daily: fetch live channel stats → compute gap to YPP tiers (30 Aug target)
# → run the obstacle audit (music licensing, duplicates, disclaimers,
# synthetic disclosure) → commit data/monetization_plan.{md,json}.

on:
  schedule:
    - cron: "0 8 * * *"   # after the 07:43 analytics/self-maintenance pass
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skillor-monetization
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements-ci.txt \
            "google-api-python-client>=2.100.0" "google-auth-oauthlib>=1.1.0"

      - name: Run monetization readiness audit
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          YT_DECLARE_SYNTHETIC_MEDIA: "true"
          YT_MADE_FOR_KIDS: "false"
        run: python scripts/monetization_readiness.py

      - name: Commit monetization plan
        if: always()
        run: |
          git config user.name "skillor-bot"
          git config user.email "skillor-bot@users.noreply.github.com"
          git add data/monetization_plan.json data/monetization_plan.md 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: monetization plan [skip ci]" && git push origin "HEAD:${GITHUB_REF_NAME}")
        continue-on-error: true

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monetization-plan
          path: data/monetization_plan.md
          if-no-files-found: ignore
