name: Neuro-Somaa French Shorts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate without YouTube upload"
        required: true
        type: boolean
        default: true
      topic:
        description: "Optional French topic; blank selects the durable demand queue"
        required: false
        type: string
        default: ""
  schedule:
    # Heatmap time is PKT (GMT+5). Generate two hours before 9 PM and 1 AM PKT.
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: neuro-somaa-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANNEL_LANGUAGE: fr
      PUBLISH_TIMEZONE: Europe/Paris
      TARGET_MIN_SECONDS: "15"
      TARGET_MAX_SECONDS: "30"
      YT_PRIVACY_STATUS: private
      YT_SCHEDULE_PUBLISH: "true"
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      VIDEO_TOPIC: ${{ inputs.topic || '' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ALT_LLM_API_KEY: ${{ secrets.ALT_LLM_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Preflight
        run: python scripts/preflight.py
      - name: Generate and upload French Short
        run: python src/main.py
      - name: Upload generated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuro-somaa-output
          if-no-files-found: ignore
          path: output/

  ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Tests
        run: pytest -q
