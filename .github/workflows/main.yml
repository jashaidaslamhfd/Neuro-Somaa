name: "Neuro-Somaa - French Shorts Automation"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic optionnel"
        required: false
        type: string
  schedule:
    # 3 videos per day for France/CET peaks:
    # 12:30 / 19:30 / 21:00 Paris Time.
    - cron: "30 10 * * *"
    - cron: "30 17 * * *"
    - cron: "0 19 * * *"

permissions:
  contents: write

concurrency:
  group: neurosomaa-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v

      - name: Generate and upload Short (French)
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          # Publish to Facebook/Instagram Reels after each YouTube Short.
          # Set to "true" once FB_ACCESS_TOKEN/FB_PAGE_ID/INSTAGRAM_USER_ID are
          # configured. Reels publish immediately (no private/schedule stage).
          FB_UPLOAD_ENABLED: "false"
          
          ENFORCE_POSTING_GAP: "true"
          GROQ_MODEL: "llama-3.1-8b-instant"
          GROQ_MODEL_FALLBACK: "llama-3.3-70b-versatile"
          MIN_HOOK_SCORE: "70"
          QUALITY_APPROVAL_THRESHOLD: "60"
          EXPERIMENT_ARM: "control"
          DURATION_EXPERIMENT: "false"
          YT_PRIVACY_STATUS: "private"
          YT_SCHEDULE_PUBLISH: "true"
          CHANNEL_LANGUAGE: "fr"
          PUBLISH_TIMEZONE: "Europe/Paris"
          
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          
          VIDEO_TOPIC: ${{ inputs.topic || '' }}
          PYTHONUNBUFFERED: "1"
          # --- Memory/thread tuning for a 7GB free runner ---
          # The heavy phase (Kokoro torch TTS + MoviePy render) was getting the
          # runner killed ~45min in (steps left "in_progress", logs lost). Limit
          # FFmpeg/MoviePy + torch threads and cap video bitrate via env so the
          # daily schedule survives. Reduced threads still render a 30-60s Short
          # well within the 200min job timeout.
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          FALLBACK_ABORT_RATIO: "0.80"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "===== Pipeline attempt $attempt/3 ====="
            if python src/main.py; then
              echo "Pipeline succeeded on attempt $attempt"
              break
            fi
            rc=$?
            echo "Pipeline failed on attempt $attempt (exit $rc)"
            if [ "$attempt" -lt 3 ]; then
              echo "Cleaning temp render state and retrying in 20s..."
              rm -rf output/frames output/tmp_* output/*.mp4.tmp
              sleep 20
            else
              exit $rc
            fi
          done

      - name: Persist durable channel state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/)" ]; then exit 0; fi
          git config user.name "neurosomaa-bot"
          git config user.email "bot@neuro-somaa.fr"
          git add -A data/
          git commit -m "chore: persist Neuro-Somaa channel state [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then break
            else sleep $((i * 5)); fi
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurosomaa-run-${{ github.run_id }}
          path: |
            output/
            data/
          retention-days: 14
          if-no-files-found: ignore
