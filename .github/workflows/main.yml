name: Neuro-Somaa French Shorts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate without YouTube upload"
        required: true
        type: boolean
        default: false
      render_only:
        description: "Render with real French narration and clips without uploading"
        required: true
        type: boolean
        default: false
      topic:
        description: "Optional French topic; blank selects the durable demand queue"
        required: false
        type: string
        default: ""
  schedule:
    # Three runs/day, aligned with the YouTube Studio audience activity heatmap:
    # - 17:30 PKT (14:30 Paris slot) -> Cron: 10:30 UTC
    # - 20:30 PKT (17:30 Paris slot) -> Cron: 13:30 UTC
    # - 23:00 PKT (20:00 Paris slot) -> Cron: 16:00 UTC
    - cron: "30 10 * * *"   # feeds the 14:30 Paris slot (17:30 PKT)
    - cron: "30 13 * * *"   # feeds the 17:30 Paris slot (20:30 PKT)
    - cron: "0 16 * * *"    # feeds the 20:00 Paris slot (23:00 PKT)

permissions:
  contents: write

concurrency:
  group: neuro-somaa-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANNEL_LANGUAGE: fr
      PUBLISH_TIMEZONE: Europe/Paris
      TARGET_MIN_SECONDS: "15"
      TARGET_MAX_SECONDS: "22"
      MIN_HOOK_SCORE: "70"
      QUALITY_APPROVAL_THRESHOLD: "60"
      YT_PRIVACY_STATUS: public
      YT_SCHEDULE_PUBLISH: "false"
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      RENDER_ONLY: ${{ inputs.render_only || 'false' }}
      VIDEO_TOPIC: ${{ inputs.topic || '' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ALT_LLM_API_KEY: ${{ secrets.ALT_LLM_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Preflight
        run: python scripts/preflight.py
      - name: Refresh topic queue
        # fetch_france_trends.py was never wired into any workflow before this,
        # so the queue only ever had the 3 topics mined once by hand on
        # 2026-09-01. Runs once/day (first Paris slot) + on manual dispatch,
        # not on all 3 daily runs, since RSS sources don't change that often.
        # Non-fatal: if every source is unreachable/rate-limited, this leaves
        # the existing queue file untouched rather than failing the run.
        if: github.event.schedule == '30 10 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/fetch_france_trends.py --limit 40 || echo "trend refresh skipped, sources unavailable"
      - name: Determine publish slot
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "30 10 * * *") echo "PUBLISH_SLOT=14:30" >> "$GITHUB_ENV" ;;
            "30 13 * * *") echo "PUBLISH_SLOT=17:30" >> "$GITHUB_ENV" ;;
            "0 16 * * *") echo "PUBLISH_SLOT=20:00" >> "$GITHUB_ENV" ;;
          esac
      - name: Generate and upload French Short (Resilient with Auto-Retry)
        run: |
          set +e
          echo "=== ATTEMPT 1: Primary French Short Production ==="
          python src/main.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "=== Success: Short produced and uploaded on Attempt 1 ==="
            exit 0
          fi

          echo "⚠️ Attempt 1 exited with code $EXIT_CODE. Initiating backoff and safety retry..."
          sleep 25

          echo "=== ATTEMPT 2: Fallback Self-Healing Production ==="
          # In attempt 2, if LLM or network had a transient hiccup, run with guaranteed resilient fallback
          python src/main.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "=== Success: Short produced and uploaded on Attempt 2 ==="
            exit 0
          fi

          echo "❌ Production failed after retries."
          exit $EXIT_CODE
      - name: Upload generated artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neuro-somaa-output
          if-no-files-found: ignore
          path: output/

  ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Tests
        run: pytest -q
