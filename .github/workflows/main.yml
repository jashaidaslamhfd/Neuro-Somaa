name: "Neuro-Somaa - French Shorts Automation"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic optionnel"
        required: false
        type: string
      dry_run:
        description: "Dry run — build the video but skip all uploads"
        required: false
        type: boolean
        default: false
  schedule:
    # 2 daily French Shorts slots aligned to the France-first audience
    # (France is 41.5% of views; Francophone markets are secondary).
    # Source: data/upload_slot_intel_fr.json, timezone Europe/Paris.
    # Selected local slots: 19:30 and 21:30 Paris time — the two highest
    # scoring confident windows in the current heatmap.
    # GitHub Actions cron is UTC. Current CEST (UTC+2) conversion:
    #   19:30 Paris = 17:30 UTC; 21:30 Paris = 19:30 UTC.
    # Re-check these UTC values when Europe/Paris changes to CET.
    - cron: "30 17 * * *"
    - cron: "30 19 * * *"

permissions:
  contents: write

concurrency:
  group: neurosomaa-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m pytest tests/ -q

      - name: Refresh live French search-demand queue
        continue-on-error: true
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          # Fill/refresh the demand queue from live YouTube France
          # autocomplete BEFORE topic selection (main.py reads
          # data/search_demand_queue_fr.json when picking the next topic).
          # Runs at most ~40 free HTTP calls; never fails the pipeline — a
          # mining hiccup must never stop a video from being made.
          python src/demand_refresh.py || true

      - name: Generate and upload Short (French)
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          
          # FB/IG Reels cross-posting — re-enabled 2026-08-15 (viral plan):
          # France's discovery surface is mostly FB/IG. Activates automatically
          # once FB_ACCESS_TOKEN / FB_PAGE_ID / INSTAGRAM_USER_ID secrets are
          # added; until then FB_UPLOAD_ENABLED evaluates to "false" and the
          # upload paths skip silently (uploader.py lines 270-340).
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FB_UPLOAD_ENABLED: ${{ secrets.FB_ACCESS_TOKEN != '' }}

          ENFORCE_POSTING_GAP: "true"
          GROQ_MODEL: "openai/gpt-oss-120b"
          GROQ_MODEL_FALLBACK: "openai/gpt-oss-20b"
          # OpenRouter: last-resort LLM fallback if the account's key loses
          # access to every Groq model at once (same failure mode as the
          # Aug-14 Groq 404 outage). No cost unless Groq fully fails.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MIN_HOOK_SCORE: "70"
          QUALITY_APPROVAL_THRESHOLD: "60"
          # Viral-engineering gate: reject + regenerate any video whose
          # predicted retention is below this. 0.50 = only publish videos
          # projected to hold >=50% average retention (the ~500-view floor).
          MIN_RETENTION: "0.50"
          # 2026-08-12 truth sweep: EXPERIMENT_ARM / DURATION_EXPERIMENT were
          # set here but read by NOTHING (dead blind config — same class of bug
          # as the phantom 70B model). scripts/duration_experiment.py writes
          # EXPERIMENT_ARM into GITHUB_ENV itself when deliberately invoked.
          YT_PRIVACY_STATUS: "private"
          YT_SCHEDULE_PUBLISH: "true"
          CHANNEL_LANGUAGE: "fr"
          PUBLISH_TIMEZONE: "Europe/Paris"
          # NICHE: Dark Psychology — manipulation, biais cognitifs,
          # secrets du comportement humain. France-first audience.
          CONTENT_SERIES: "dark_psychology_fr"
          TOPIC_STRATEGY: "dark_psychology_series_fr"
          
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          # Licensed stock B-roll (genuine motion, monetization-safe)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # 2026-08-17: AI image-to-video (Seedance 2.5 via Pollinations) —
          # upgrades static scene images into genuine motion clips; needs the
          # POLLINATIONS_KEY secret (added by user 2026-08-16).
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # 2026-08-20: viral BGM fallback. When set to "true", any run that
          # falls through to the synthetic ambient drone instead tries the
          # ModelsLab AI-generated unique track (emotional piano/violin
          # minor-key bed, original per video, no Content ID) BEFORE the
          # drone. MODELSLAB_API_KEY already exists in repo secrets.
          VIRAL_BGM_FALLBACK: "true"
          # 2026-08-20: force SHORTS-TIER image resolution (>=720px shortest
          # side). Anything smaller (e.g. AI-Horde anonymous 448x768 / 320x512)
          # blurs when stretched to 1080x1920 and now forces a retry on a
          # better provider instead of publishing mush.
          MIN_IMAGE_STRICT: "true"
          # Render multiple candidates and publish only the best mobile-readable variant.
          THUMBNAIL_VARIANT_COUNT: "4"
          MIN_THUMBNAIL_SCORE: "80"
          # 2026-08-21: stock clip quality floor — Pexels/Pixabay clips must
          # be portrait (w<h) AND at least 720px wide, or they blur/squash on
          # the 1080x1920 canvas. Below-floor clips are skipped and the next
          # candidate (or a later layer) is tried instead.
          MIN_STOCK_CLIP_WIDTH: "720"

          # --- French audience voice ---
          # fr-FR-HenriNeural is proven reliable on edge-tts (full-length
          # segments). fr-FR-RemyNeural is a nicer tone BUT intermittently
          # returns "No audio received" on the CI runner, so it's not default.
          # Voice auto-fallback in voice_generator tries alternates before
          # Kokoro, so the pipeline keeps working regardless.
          # 2026-08-19: CHATTERBOX PRIMARY — its default voice is a REAL
          # professionally recorded narrator (free, MIT, 23 languages,
          # beats ElevenLabs in blind evals). edge-tts Henri pool is the
          # built-in runner-safe safety net if Chatterbox can't load —
          # no slot is ever missed.
          TTS_ENGINE: "chatterbox"
          EDGE_FR_VOICE: "fr-FR-MauriceNeural"
          EDGE_FR_VOICE_ALT1: "fr-FR-HenriNeural"
          EDGE_FR_VOICE_ALT2: "fr-FR-DeniseNeural"
          EDGE_FR_RATE: "-8%"
          # 2026-08-19: ADULT-MALE-ONLY voice rotation — the young/female
          # timbres were flagged as "child-like" by the audience. Deep adult
          # French male voices, hashed per TOPIC for episode consistency.
          EDGE_FR_VOICE_POOL: "fr-FR-MauriceNeural,fr-FR-GerardNeural,fr-FR-LucienNeural,fr-FR-AlainNeural,fr-FR-HenriNeural"
          # 2026-08-15: natural breath pause between scenes (human pacing).
          BREATH_PAUSE_SECONDS: "0.45"
          # 2026-08-15: natural delivery variation — per-scene pacing drift
          # (hook faster, questions slower, micro-jitter everywhere) so the
          # narration never sits at one flat machine tempo.
          DELIVERY_VARIATION: "true"
          # --- Background music: original in-repo beds (Content-ID safe) ---
          MUSIC_VOLUME: "0.18"
          
          VIDEO_TOPIC: ${{ inputs.topic || '' }}
          # 2026-08-19: optional dry-run mode — builds the full video
          # (script + voice + visuals + metadata) but uploader.py logs
          # "[DRY_RUN] Would upload" and posts NOTHING. Kept false by
          # default so scheduled crouns can never become dry runs.
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          PYTHONUNBUFFERED: "1"
          # --- Memory/thread tuning for a 7GB free runner ---
          # The heavy phase (Kokoro torch TTS + MoviePy render) was getting the
          # runner killed ~45min in (steps left "in_progress", logs lost). Limit
          # FFmpeg/MoviePy + torch threads and cap video bitrate via env so the
          # daily schedule survives. Reduced threads still render a 30-60s Short
          # well within the 200min job timeout.
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          FALLBACK_ABORT_RATIO: "0.80"
        run: |
          # set +e around the pipeline call so we control the exit code
          # explicitly. Under `set -e`, an `if`-guard can mask the real code,
          # which is exactly what made the last run report "exit 0" after the
          # upload failed with invalid_scope.
          set -euo pipefail
          rc=1
          cleanup_pipeline_group() {
            if [ -n "${pipeline_pid:-}" ] && kill -0 "$pipeline_pid" 2>/dev/null; then
              echo "Stopping pipeline process group $pipeline_pid"
              kill -TERM -- "-$pipeline_pid" 2>/dev/null || true
              sleep 5
              kill -KILL -- "-$pipeline_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_pipeline_group EXIT INT TERM
          for attempt in 1 2 3; do
            echo "===== Pipeline attempt $attempt/3 ====="
            set +e
            # A bounded attempt prevents one silent model/provider stall from
            # consuming the entire 200-minute job. setsid lets cancellation
            # terminate Python, MoviePy, and every FFmpeg child together.
            setsid timeout --signal=TERM --kill-after=120s 55m python src/main.py &
            pipeline_pid=$!
            (
              while kill -0 "$pipeline_pid" 2>/dev/null; do
                echo "[heartbeat] pipeline attempt $attempt still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                sleep 60
              done
            ) &
            heartbeat_pid=$!
            wait "$pipeline_pid"
            rc=$?
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
            pipeline_pid=""
            set -e
            echo "Pipeline attempt $attempt finished (exit $rc)"
            if [ "$rc" -eq 0 ]; then
              echo "Pipeline succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Cleaning temp render state and retrying in 20s..."
              rm -rf output/frames output/tmp_* output/*.mp4.tmp
              sleep 20
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "Pipeline failed after $attempt attempt(s) with exit $rc"
            exit "$rc"
          fi

      - name: Persist durable channel state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/)" ]; then exit 0; fi
          git config user.name "neurosomaa-bot"
          git config user.email "bot@neuro-somaa.fr"
          git add -A data/
          git commit -m "chore: persist Neuro-Somaa channel state [skip ci]"
          # Later steps (or a concurrent run's commit racing this one) can
          # leave unstaged files; stash them before pulling so 'pull --rebase'
          # never fails with 'You have unstaged changes'.
          git stash --quiet --include-untracked || true
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then break
            else sleep $((i * 5)); fi
          done
          git stash pop --quiet 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurosomaa-run-${{ github.run_id }}
          path: |
            output/
            data/
          retention-days: 14
          if-no-files-found: ignore
