name: Hotfix content.py syntax
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Normalize EDGE_FR_RATE for edge-tts
        run: |
          python3 << 'PY'
          from pathlib import Path
          path = Path("src/audio.py")
          text = path.read_text(encoding="utf-8")
          old = 'rate = os.getenv("EDGE_FR_RATE", "-3%")'
          new = '''rate = os.getenv("EDGE_FR_RATE", "-3%").strip() or "-3%"
    # edge-tts requires a leading sign: "0%" is invalid, "+0%" is valid
    if rate[0].isdigit():
        rate = "+" + rate'''
          if old not in text:
              raise SystemExit("pattern not found")
          text = text.replace(old, new, 1)
          compile(text, "audio.py", "exec")
          path.write_text(text, encoding="utf-8")
          print("audio rate normalized")
          PY
          python -m compileall -q src/audio.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio.py
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "fix: normalize edge-tts rate (0% -> +0%)"
          git push origin HEAD:main
