name: "verify-desc-temp"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.parse,urllib.request,re
          d=urllib.parse.urlencode({"client_id":os.environ["GOOGLE_CLIENT_ID"],
            "client_secret":os.environ["GOOGLE_CLIENT_SECRET"],
            "refresh_token":os.environ["REFRESH_TOKEN"],
            "grant_type":"refresh_token"}).encode()
          tok=json.load(urllib.request.urlopen(urllib.request.Request(
            "https://oauth2.googleapis.com/token",data=d),timeout=30))["access_token"]
          ids="68B-7lTf8nU,T755Q7yX-DA,5O3z79vFaZw"
          r=urllib.request.Request(f"https://www.googleapis.com/youtube/v3/videos?part=snippet&id={ids}")
          r.add_header("Authorization",f"Bearer {tok}")
          data=json.load(urllib.request.urlopen(r,timeout=30))
          JUNK={'quil','faut','comprendre','semble','explique','passe','science','derrière'}
          for it in data["items"]:
              s=it["snippet"]; h=re.findall(r'#(\w+)',s["description"])
              junk=[x for x in h if x.lower() in JUNK]
              print(f"{it['id']}  hashtags={['#'+x for x in h]}")
              print(f"           junk={junk or 'NONE ✅'}")
              print(f"           tags={s.get('tags',[])[:6]}")
          PY
