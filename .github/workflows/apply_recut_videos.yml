name: "Neuro-Somaa - Apply Five Re-cut Optimizations"

on:
  workflow_dispatch:
    inputs:
      upload_mode:
        description: "YouTube state for new re-cuts; private is the safe default"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - scheduled
      generate_assets:
        description: "Generate missing scene assets through the configured provider chain"
        required: true
        default: true
        type: boolean
      skip_existing_metadata:
        description: "Do not change titles/descriptions/tags/thumbnails on the five existing Shorts"
        required: true
        default: false
        type: boolean
      skip_recut_uploads:
        description: "Render and audit only; do not create new YouTube uploads"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  apply-recuts:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPAI_API_KEY: ${{ secrets.DEEPAI_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
      TTS_ENGINE: "edge"
      EDGE_FR_VOICE_POOL: "fr-FR-MauriceNeural,fr-FR-GerardNeural,fr-FR-LucienNeural,fr-FR-AlainNeural,fr-FR-HenriNeural"
      BREATH_PAUSE_SECONDS: "0.45"
      DELIVERY_VARIATION: "true"
      MUSIC_VOLUME: "0.18"
      MIN_THUMBNAIL_SCORE: "80"
      MIN_HOOK_SCORE: "70"
      TARGET_MIN_SECONDS: "15"
      TARGET_MAX_SECONDS: "55"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      FFMPEG_THREADS: "2"
      FB_UPLOAD_ENABLED: "false"
      YT_MADE_FOR_KIDS: "false"
      YT_DECLARE_SYNTHETIC_MEDIA: "true"
      RECUT_UPLOAD_MODE: ${{ inputs.upload_mode }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate manifest and OAuth configuration
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$REFRESH_TOKEN"
          PYTHONPATH=.:src python scripts/render_recut_batch.py data/recut_batch_manifest.example.json --dry-run

      - name: Render and audit five re-cuts
        run: |
          set -euo pipefail
          args=(data/recut_batch_manifest.example.json --output-dir output/recut_batch)
          if [ "${{ inputs.generate_assets }}" = "true" ]; then
            args+=(--generate-assets)
          fi
          PYTHONPATH=.:src python scripts/render_recut_batch.py "${args[@]}"

      - name: Apply existing metadata/thumbnails and upload re-cuts
        if: ${{ inputs.skip_existing_metadata == false || inputs.skip_recut_uploads == false }}
        run: |
          set -euo pipefail
          args=(data/recut_batch_manifest.example.json --output-dir output/recut_batch --execute)
          if [ "${{ inputs.skip_existing_metadata }}" = "true" ]; then
            args+=(--skip-existing)
          fi
          if [ "${{ inputs.skip_recut_uploads }}" = "true" ]; then
            args+=(--skip-uploads)
          fi
          PYTHONPATH=.:src python scripts/apply_recut_updates.py "${args[@]}"

      - name: Upload re-cut evidence and media artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: french-recut-application-${{ github.run_id }}
          path: output/recut_batch
          if-no-files-found: warn
          retention-days: 30
