name: "FR Full Optimize (all videos)"

# One-shot workflow: builds the French-optimization plan for ALL channel
# videos (published + scheduled) and applies it. Run manually from the
# Actions tab — dry-run by default, use apply=true to write to YouTube.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = write titles/desc/tags/thumbs to YouTube"
        required: true
        default: false
        type: boolean
      limit:
        description: "Max videos (0 = all)"
        required: false
        default: "0"
        type: string
      thumbs:
        description: "Also regenerate thumbnails"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

concurrency:
  group: skillor-fr-optimize
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -q "google-api-python-client>=2.100.0" "google-auth-oauthlib>=1.1.0" Pillow

      - name: Install fonts for thumbnails
        run: sudo apt-get install -y -qq fonts-dejavu-core

      - name: Build + apply metadata plan
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          CMD="python scripts/fr_batch_optimize.py --limit ${{ inputs.limit }}"
          if [ "${{ inputs.apply }}" = "true" ]; then CMD="$CMD --apply"; fi
          $CMD
          if [ "${{ inputs.thumbs }}" = "true" ]; then
            TH="python scripts/fr_thumbnail_regen.py --limit ${{ inputs.limit }}"
            if [ "${{ inputs.apply }}" = "true" ]; then TH="$TH --apply"; fi
            $TH
          fi

      - name: Commit plan + thumbs
        if: always()
        run: |
          git config user.name "skillor-bot"
          git config user.email "skillor-bot@users.noreply.github.com"
          git add data/fr_optimize_plan.json data/fr_optimize_plan.md output/thumbs 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: FR optimize plan + thumbs [skip ci]" && git push origin "HEAD:${GITHUB_REF_NAME}")
        continue-on-error: true

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-optimize-plan
          path: data/fr_optimize_plan.md
          if-no-files-found: ignore
