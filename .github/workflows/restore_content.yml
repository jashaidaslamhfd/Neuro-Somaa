name: Restore content.py from good commit
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 80
      - name: Restore and fix content.py
        run: |
          set -euo pipefail
          git show fb01b0e9bb2fe674b32a0619fe1cf8748cfbc2c1:src/content.py > src/content.py
          python3 << 'PY'
          from pathlib import Path
          path = Path("src/content.py")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          fixed_fn = (
              "def _format_clean_title(clean: str) -> str:\n"
              '    """Normalize a title without ever cutting it mid-thought."""\n'
              "    clean = re.sub(r'^[«\"]\\s*', '', clean)\n"
              "    clean = re.sub(r'\\s*[»\"]\\s*$', '', clean)\n"
              "    clean = re.sub(r\"\\s+\", \" \", clean).strip()\n"
              "    if len(clean) > 58:\n"
              "        clean = clean[:58].rsplit(\" \", 1)[0].rstrip(\" ,.;:\")\n"
              "    if clean and clean[-1] not in \"?!.\":\n"
              "        clean = clean + \" ?\"\n"
              "    return clean\n\n\n"
          )
          out = []
          i = 0
          while i < len(lines):
              if lines[i].startswith("def _format_clean_title"):
                  out.append(fixed_fn)
                  i += 1
                  while i < len(lines) and not lines[i].startswith("def _fallback_script"):
                      i += 1
                  continue
              if lines[i].strip() == ", '', clean)":
                  i += 1
                  while i < len(lines) and not lines[i].startswith("def _fallback_script") and not lines[i].startswith("def "):
                      i += 1
                  continue
              out.append(lines[i])
              i += 1
          new_text = "".join(out)
          compile(new_text, "content.py", "exec")
          path.write_text(new_text, encoding="utf-8")
          print("RESTORED AND FIXED", len(new_text), "chars")
          PY
          python -m compileall -q src/content.py
          echo "compileall OK"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content.py
          git commit -m "fix: restore content.py and repair _format_clean_title syntax" || exit 0
          git push origin HEAD:main
