name: CI - guard tests on push

# Every push must pass the test suite BEFORE a scheduled pipeline run can
# break on it. If a commit would crash the daily pipeline, this fails loud
# here instead of silently killing uploads at 19:00 Paris time.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI deps (offline test set — no torch/kokoro)
        run: |
          python -m pip install --upgrade pip
          # The test suite is fully offline; installing the full production
          # requirements.txt pulled torch + kokoro (~2 GB) on every push just
          # to run 22 offline tests. requirements-ci.txt is the minimal set.
          for i in 1 2 3; do python -m pip install -r requirements-ci.txt && break || { echo retry; sleep 10; }; done
      - name: Compile gate (syntax crash-landed commits die here)
        run: python -m compileall -q src scripts tests
      - name: Ruff lint gate (no unresolved repository violations)
        run: ruff check src scripts tests
      - name: Run test suite
        run: python -m pytest tests/ -q
