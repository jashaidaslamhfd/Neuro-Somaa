name: CI - guard tests on push

# Every push must pass the test suite BEFORE a scheduled pipeline run can
# break on it. If a commit would crash the daily pipeline, this fails loud
# here instead of silently killing uploads at 19:00 Paris time.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install CI deps (offline test set — no torch/kokoro)
        run: |
          python -m pip install --upgrade pip
          # The test suite is fully offline; installing the full production
          # requirements.txt pulled torch + kokoro (~2 GB) on every push just
          # to run 22 offline tests. requirements-ci.lock is the reviewed, reproducible CI dependency graph.
          for i in 1 2 3; do python -m pip install --require-hashes -r requirements-ci.lock && break || { echo retry; sleep 10; }; done
      - name: Compile gate (syntax crash-landed commits die here)
        run: python -m compileall -q src scripts tests
      - name: Ruff lint gate (no unresolved repository violations)
        run: ruff check src scripts tests
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: Reject test-induced repository state changes
        run: |
          git diff --exit-code -- . ':!output/**'
          test -z "$(git status --porcelain --untracked-files=no)"
