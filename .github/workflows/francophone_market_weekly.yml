name: Neuro-Somaa - Weekly Francophone Market Experiment

on:
  schedule:
    # Sunday 15:30 UTC = 11:30 America/Port-au-Prince during the current
    # daylight period; this is a controlled weekly daytime Haiti experiment.
    - cron: "30 15 * * 0"
  workflow_dispatch:
    inputs:
      market:
        description: "Market cohort label"
        required: false
        type: choice
        options:
          - haiti
          - francophone_expansion
        default: haiti
      dry_run:
        description: "Render and audit only; skip YouTube upload"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Share the production lock so the weekly experiment cannot overlap with
  # the France-first daily pipeline and consume duplicate topic/media state.
  group: neurosomaa-pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BATCH_COUNT: "1"
  BATCH_MODE: "false"
  YT_PRIVACY_STATUS: "private"
  YT_SCHEDULE_PUBLISH: "false"
  CHANNEL_LANGUAGE: "fr"
  PUBLISH_TIMEZONE: "America/Port-au-Prince"
  USE_DYNAMIC_SCHEDULE: "false"
  AUDIENCE_MARKET: ${{ inputs.market || 'haiti' }}
  MARKET_EXPERIMENT_ID: ${{ inputs.market || 'haiti' }}_weekly_v1
  TOPIC_STRATEGY: "body_glitch_series_fr"
  CONTENT_SERIES: "faits_surprenants_fr"
  TTS_ENGINE: "edge"
  EDGE_FR_VOICE: "fr-FR-HenriNeural"
  EDGE_FR_RATE: "-8%"
  DELIVERY_VARIATION: "false"
  BREATH_PAUSE_SECONDS: "0.20"
  MIN_HOOK_SCORE: "70"
  QUALITY_APPROVAL_THRESHOLD: "60"
  MIN_RETENTION: "0.50"
  THUMBNAIL_VARIANT_COUNT: "4"
  MIN_THUMBNAIL_SCORE: "80"
  MIN_IMAGE_STRICT: "true"
  VIRAL_BGM_FALLBACK: "true"
  ENFORCE_POSTING_GAP: "true"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  FALLBACK_ABORT_RATIO: "0.80"

jobs:
  weekly-market-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system and Python dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate repository before generation
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m pytest tests/ -q

      - name: Refresh French demand queue
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/demand_refresh.py || true

      - name: Generate and upload one private market experiment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          MODELSLAB_API_KEY: ${{ secrets.MODELSLAB_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python src/main.py 2>&1 | tee weekly-market-experiment.log

      - name: Write experiment report
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = {
              "experiment_id": os.environ["MARKET_EXPERIMENT_ID"],
              "market": os.environ["AUDIENCE_MARKET"],
              "timezone": os.environ["PUBLISH_TIMEZONE"],
              "scheduled_trigger": "Sunday 15:30 UTC",
              "upload_mode": os.environ["YT_PRIVACY_STATUS"],
              "schedule_publish": os.environ["YT_SCHEDULE_PUBLISH"],
              "batch_count": int(os.environ["BATCH_COUNT"]),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "sha": os.environ.get("GITHUB_SHA"),
          }
          Path("market_experiment_report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - name: Upload weekly experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: francophone-market-experiment-${{ github.run_id }}
          path: |
            weekly-market-experiment.log
            market_experiment_report.json
            data/video_history.json
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 6
          overwrite: true

      - name: Commit learned state when changed
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search_demand_queue_fr.json data/video_history.json data/upload_state.json || true
          git diff --cached --quiet || git commit -m "chore: record weekly Francophone market experiment"
          git push || true

      - name: Publish control summary
        if: always()
        run: |
          echo "Market cohort: ${AUDIENCE_MARKET}"
          echo "Experiment ID: ${MARKET_EXPERIMENT_ID}"
          echo "Upload privacy: ${YT_PRIVACY_STATUS}"
          echo "Scheduled publish: ${YT_SCHEDULE_PUBLISH}"
          echo "No immediate public publishing is enabled."
          echo "Review the artifact and YouTube Studio metrics after 48-72 hours."
          echo "Do not publish the experiment publicly until retention and geography are reviewed."
          echo "::notice title=Market experiment::Private ${AUDIENCE_MARKET} experiment completed or was audited; review evidence before publishing."
          true
          
