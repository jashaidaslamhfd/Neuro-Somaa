name: "SKILLOR - French Competitor Repair"

# End-to-end loop the user asked for:
#   1) scrape top French niche channels (YouTube API) -> competitor_intel_fr.json
#   2) ML learns patterns from competitor + our analytics   -> ml_brain_state.json
#   3) repair already-uploaded Shorts with the learned patterns (French)
#
# Repair runs DRY by default. Set inputs.apply = true to write to YouTube.
# Requires YOUTUBE_API_KEY for scraping; GOOGLE_CLIENT_ID/SECRET/REFRESH_TOKEN
# for --apply.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write repairs to YouTube (true) or dry-run (false)"
        required: false
        type: boolean
        default: false
      limit:
        description: "Max videos to repair (0 = all)"
        required: false
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: skillor-competitor-repair
  cancel-in-progress: false

jobs:
  competitor-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "google-api-python-client>=2.100.0" "google-auth>=2.25.0" "google-auth-oauthlib>=1.1.0" "google-auth-httplib2>=0.2.0" "requests>=2.31.0" "python-dotenv>=1.0.0" "numpy>=1.24.0" "Pillow>=10.0.0" "moviepy>=1.0.3,<2.0.0" "imageio-ffmpeg>=0.4.8" "soundfile>=0.12.1"

      - name: Scrape top French niche channels (competitor intel)
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COMPETITOR_INTEL_PATH: "data/competitor_intel_fr.json"
          COMPETITOR_QUERIES_FR: ${{ vars.COMPETITOR_QUERIES_FR || '' }}
          # Top body-science / skeleton faceless Shorts channels in this niche
          # (S-tier per 2026 faceless-niche data). Scraping them directly gives
          # the ML far more viral pattern samples than a 1M-view filter alone.
          COMPETITOR_CHANNEL_IDS: ${{ vars.COMPETITOR_CHANNEL_IDS || '' }}
          COMPETITOR_MIN_VIEWS: "150000"
          COMPETITOR_MAX_DURATION_SECONDS: "90"
          COMPETITOR_MAX_VIDEOS_PER_CHANNEL: "40"
          COMPETITOR_MAX_RESULTS_PER_QUERY: "25"
        run: |
          set -euo pipefail
          python scripts/competitor_analysis.py
          echo "--- competitor_intel_fr.json ---"
          python -c "import json;d=json.load(open('data/competitor_intel_fr.json'));print('configured:',d.get('configured'));print('safe_title_templates:',len(d.get('safe_title_templates') or []));print('high_value_tags:',len(d.get('high_value_tags') or []))"

      - name: ML learns from top viral channels + our analytics (niche intel feed)
        shell: bash
        env:
          SKILLOR_DATA_DIR: "data"
          ML_BRAIN_STATE_PATH: "data/ml_brain_state.json"
          COMPETITOR_INTEL_PATH: "data/competitor_intel_fr.json"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          # niche_intel builds competitor + demand intel and feeds it into ML
          # training, so the brain learns from TOP viral channels in the niche,
          # not just our own channel history.
          python scripts/niche_intel.py || echo "niche_intel partial; continuing"
          # train the brain on the combined (ours + competitor) dataset
          python scripts/ml_brain.py || echo "ML train produced no output; continuing with existing state"

      - name: Repair uploaded videos (French, competitor + ML driven)
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          VIDEO_HISTORY_PATH: "data/video_history.json"
          COMPETITOR_INTEL_PATH: "data/competitor_intel_fr.json"
          ML_BRAIN_STATE_PATH: "data/ml_brain_state.json"
        run: |
          set -euo pipefail
          if [ "${{ inputs.apply }}" == "true" ]; then
            python scripts/fr_competitor_repair.py --apply --with-thumbnails --reschedule --limit ${{ inputs.limit }}
          else
            python scripts/fr_competitor_repair.py --with-thumbnails --reschedule --limit ${{ inputs.limit }}
          fi

      - name: Persist updated state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/)" ]; then echo "No changes."; exit 0; fi
          git config user.name "skillor-bot"
          git config user.email "skillor-bot@users.noreply.github.com"
          git add -A data/
          git commit -m "chore: competitor intel + ML state + repair ledger [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then break
            else echo "Retry $i"; sleep $((i*5)); fi
          done

      - name: Upload repair artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-competitor-repair-${{ github.run_id }}
          path: |
            data/competitor_intel_fr.json
            data/ml_brain_state.json
            data/niche_intelligence.json
            data/title_bandit_fr.json
          retention-days: 14
          if-no-files-found: ignore
