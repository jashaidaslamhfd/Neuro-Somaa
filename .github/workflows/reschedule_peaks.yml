name: "Reschedule pending videos to peak slots (FR)"
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set 'yes' to apply changes (empty = dry-run)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  reschedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - name: Reschedule to peaks
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          args=""
          [ "${{ inputs.apply }}" = "yes" ] && args="--apply"
          python scripts/reschedule_to_peaks.py $args
