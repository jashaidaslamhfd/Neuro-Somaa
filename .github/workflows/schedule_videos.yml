name: Schedule existing YouTube videos

on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: "Comma-separated YouTube video IDs"
        required: true
        type: string
      publish_ats:
        description: "Comma-separated ISO-8601 UTC publication times"
        required: true
        type: string

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIDEO_IDS: ${{ inputs.video_ids }}
      PUBLISH_ATS: ${{ inputs.publish_ats }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Schedule videos
        run: python scripts/schedule_videos.py
