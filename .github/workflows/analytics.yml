name: "Neuro-Somaa - YouTube Analytics Sync"
on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Refetch all mature videos now, including fresh analytics records"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 5 * * *"
permissions:
  contents: write
concurrency:
  group: neurosomaa-analytics-sync
  cancel-in-progress: false
jobs:
  sync-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # seo_analytics.py imports numpy/Pillow lazily (inside score_thumbnail),
          # so this sync deliberately stays on the light dependency set.
          python -m pip install "google-api-python-client>=2.100.0" "google-auth>=2.25.0" "google-auth-oauthlib>=1.1.0" "google-auth-httplib2>=0.2.0" "requests>=2.31.0" "python-dotenv>=1.0.0" "pytz>=2024.1" "numpy>=1.24.0"

      - name: Guard - analytics entrypoint must import on the light dep set
        shell: bash
        run: |
          set -euo pipefail
          # Regression guard: a module-level `import numpy` in seo_analytics.py
          # silently broke every analytics sync for weeks. Fail loudly here.
          python -c "import sys; sys.path.insert(0, 'src'); import analytics_updater; print('import OK')"
      - name: Validate YouTube OAuth grant and Analytics scope
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python scripts/check_youtube_analytics_auth.py --require-analytics

      - name: Sync real analytics into video history
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          # FB/IG metrics envs removed (dead config — no FB data ever flowed).
          VIDEO_HISTORY_PATH: "data/video_history.json"
          ANALYTICS_SCOPE_REQUIRED: "true"
          # Refetch real views more often (every 12h) so the ML brain learns
          # from the freshest numbers instead of 24-48h stale readings.
          METRICS_MIN_HOURS: ${{ github.event.inputs.force_refresh == 'true' && '0' || '24' }}
          METRICS_REFRESH_HOURS: ${{ github.event.inputs.force_refresh == 'true' && '0' || '12' }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python src/analytics_updater.py
          # Prune dated diagnostic snapshots (keep last 7 days + newest) so
          # data/ stops growing a permanent file per day per system. Stdlib
          # only — safe on this light dependency set.
          python scripts/cleanup_data_snapshots.py
      - name: Refresh live French search-demand queue
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          # Refill search_demand_queue_fr.json from live YouTube France
          # autocomplete when stale (every 4 days) or empty. Never fails the
          # workflow — a mining hiccup must never block the analytics sync.
          python src/demand_refresh.py || true

      - name: Persist updated analytics state (with retry)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/)" ]; then echo "No analytics changes."; exit 0; fi
          git config user.name "neurosomaa-bot"
          git config user.email "neurosomaa-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: sync YouTube analytics into history [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then break
            else echo "Retry $i"; sleep $((i*5)); if [ $i -eq 3 ]; then exit 0; fi; fi
          done
