name: Sync YouTube analytics + growth states

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max videos to refresh"
        required: false
        default: "50"
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sync analytics into video_history.json
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          ANALYTICS_LIMIT: ${{ inputs.limit || '50' }}
          DATA_DIR: data
        run: python scripts/sync_analytics.py
      - name: Persist updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/video_history.json
          if git diff --cached --quiet; then
            echo "No analytics changes to commit"
            exit 0
          fi
          git commit -m "chore: sync YouTube analytics + growth states"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            sleep $((i * 2))
          done
