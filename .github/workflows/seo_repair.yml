name: SEO Repair (uploaded videos)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "apply = rewrite title/description/tags on YouTube; dry = plan only (read-only)"
        type: choice
        options: ["dry", "apply"]
        default: "dry"
      thumbnails:
        description: "Also replace thumbnails (needs channel verified for custom thumbnails)"
        type: boolean
        default: false
      all_videos:
        description: "Repair ALL videos, not just the ones flagged with issues"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: seo-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow groq

      - name: Run SEO audit + repair
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: |
          set -euo pipefail
          ARGS="--live --plan"
          if [ "${{ inputs.mode }}" = "apply" ]; then ARGS="$ARGS --apply"; fi
          if [ "${{ inputs.thumbnails }}" = "true" ]; then ARGS="$ARGS --with-thumbnails"; fi
          if [ "${{ inputs.all_videos }}" = "true" ]; then ARGS="$ARGS --all"; fi
          echo "Running: python scripts/channel_seo_audit.py $ARGS"
          python scripts/channel_seo_audit.py $ARGS

      - name: Upload repair plan + regenerated thumbnails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seo-repair-artifacts
          if-no-files-found: ignore
          path: |
            data/seo_repair_plan_*.json
            data/seo_repair_preview_*.md
            data/channel_seo_audit_*.md
            output/thumbnails_repaired/
