# ============================================================
# SKILLOR — project configuration
# Tooling: ruff (lint + format), pytest.
# This file gives the whole codebase ONE consistent quality
# standard so local dev and CI agree.
# ============================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillor-channel"
version = "1.0.0"
description = "France-first YouTube Shorts automation pipeline (science du quotidien)."
readme = "README.md"
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# ruff — linter & formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "output",
    "assets",
]

[tool.ruff.lint]
# French copy intentionally uses Unicode apostrophes, dashes, symbols, and
# typography. These are content characters, not Python operator ambiguity.
ignore = ["RUF001", "RUF002", "RUF003"]
# Default set + a few targeted quality groups:
#   I   = isort (import sorting)
#   UP  = pyupgrade (modern Python syntax)
#   B   = flake8-bugbear (likely bugs / smells)
#   SIM = flake8-simplify
#   PIE = flake8-pie
#   RUF = ruff-specific
#   C4  = flake8-comprehensions
#   FURB = refurb (readability)
#   DTZ = flake8-datetimez (tz-aware datetimes — this channel is tz-sensitive)
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PIE", "RUF", "C4", "FURB", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# CLI entry points and repair scripts legitimately swallow broad exceptions
# so one bad video never aborts a channel-wide batch run.
"scripts/*.py" = ["BLE001", "S110", "S112", "E402"]
"src/main.py" = ["BLE001"]
# These modules intentionally bootstrap sys.path before optional imports.
"src/analytics_updater.py" = ["E402"]
"src/image_providers.py" = ["E402"]
"src/video_editor.py" = ["E402"]
"src/intelligence/bandit.py" = ["E402"]
# Offline unit tests may construct stubs loosely and bootstrap src imports.
"tests/*.py" = ["BLE001", "DTZ", "S101", "E402"]
"tests/test_runtime_config.py" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = [
    "script_generator", "image_generator", "voice_generator", "video_editor",
    "uploader", "niche_strategy", "quality_checker", "scheduler", "anti_spam",
    "french_quality_gate", "seo_generator", "shorts_enhancer", "seo_analytics",
    "trend_fetcher", "media_validator", "analytics_updater", "image_providers",
    "trend_research", "strict_quality_gate",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
